<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urban Moon · web + mobil</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Figtree:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F4F0;--ink:#141414;--grey:#8C8C88;--hair:#E0DFD9;--wash:#ECEBE6;--s:"Newsreader",Georgia,serif;--f:"Figtree","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#b5b3ad;font-family:var(--f);padding:28px 18px 80px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#77756f;margin:44px 0 12px}
.lbl:first-of-type{margin-top:0}
.pair{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
img{display:block;width:100%;height:100%;object-fit:cover}
ul{list-style:none}
li{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}

/* frames */
.dk{width:100%;max-width:960px;min-height:640px;background:var(--paper);color:var(--ink);display:flex;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.dk .art{width:42%;flex:none;background:#ccc;overflow:hidden}
.dk.dense .art{width:34%}
.dk .side{flex:1;padding:26px 44px 24px;display:flex;flex-direction:column;min-width:0}
.dk .mid{margin:auto 0;padding:28px 0}
.dk.noart .art{display:none}
.dk.noart .side{max-width:620px;margin:0 auto;width:100%}
.mb.noart .art{display:none}
.mb{width:360px;min-height:760px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.5);padding:22px 22px 20px}
.mb .art{height:190px;margin-top:18px;background:#ccc;overflow:hidden;flex:none}
.mb.dense .art{display:none}
.mb .side{display:flex;flex-direction:column;flex:1;min-width:0}
.mb .mid{padding:22px 0 20px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.top .wm{font:600 14px/1 "Playfair Display",Georgia,serif;letter-spacing:.14em}
.top .ct{color:var(--grey);letter-spacing:.06em;text-transform:none;font-size:11.5px;font-variant-numeric:tabular-nums}
.bot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.lnk{font-size:14px;color:var(--grey)}
.go{width:54px;height:54px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.go.off{background:#C9C8C2}
.go svg{width:20px;height:20px;stroke:var(--paper);stroke-width:1.5;fill:none}
.go span{color:var(--paper);font-size:13px;font-weight:500;margin-right:8px}
.go.w{width:auto;padding:0 20px 0 22px;border-radius:27px}

/* type */
.q{font:300 34px/1.12 var(--s);font-variation-settings:"opsz" 72;letter-spacing:-.012em;margin-bottom:22px;max-width:16ch}
.mb .q{font-size:27px;max-width:none}
.q.sm{font-size:26px;margin-bottom:16px}
.mb .q.sm{font-size:24px}
.sub{font:300 17px/1.4 var(--s);font-variation-settings:"opsz" 24;color:#5A5955;margin:-10px 0 20px;max-width:40ch}
.mb .sub{font-size:16px}
.fl{font-size:13px;color:var(--grey);margin:18px 0 8px}
.tag{display:inline-block;font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:5px 9px;margin-bottom:22px}

/* keyed cells */
.opts li,.grid li,.row li{display:flex;align-items:center;gap:14px;border:1px solid var(--hair);background:#fff;border-radius:4px;padding:12px 14px;font-size:15.5px;color:#33322F;transition:all .18s;position:relative}
.opts li{margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{width:24px;height:24px;border:1px solid #CFCEC8;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--grey);flex:none;transition:all .18s}
li .t{display:block}
li .t small{display:block;font-size:12.5px;color:var(--grey);margin-top:2px;font-weight:400}
li.on{border-color:var(--ink);color:var(--ink);font-weight:500;box-shadow:0 4px 10px -6px rgba(0,0,0,.25);transform:translateY(-1px)}
li.on .k{background:var(--ink);border-color:var(--ink);color:#fff;font-size:0}
li.on .k:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin-top:-2px}
li.dim{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row li{padding:9px 14px 9px 10px;font-size:14px;gap:10px;margin:0}
.row li .k{width:20px;height:20px;font-size:10px}
.row li.on .k{font-size:0}
.row li.on .k:after{width:4px;height:7px}

/* word list (rooms) */
.words{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;border-top:1px solid var(--hair)}
.words li{font:300 22px/1.2 var(--s);font-variation-settings:"opsz" 30;color:#9A9994;padding:13px 0;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;transition:color .15s}
.words li:after{content:"";width:14px;height:14px;border:1px solid #CFCEC8;border-radius:2px;flex:none;transition:all .15s}
.words li.on{color:var(--ink);font-weight:400;box-shadow:none;transform:none;border-color:var(--hair)}
.words li.on:after{border-color:var(--ink);background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14'><path d='M3.5 7.5l2.5 2.5 4.5-5' fill='none' stroke='white' stroke-width='1.5'/></svg>") center/contain no-repeat}
.mb .words li{font-size:20px;padding:12px 0}

/* joined grid (rooms) */
.gseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #CFCEC8;border-radius:4px;overflow:hidden;background:#fff}
.gseg li{padding:18px 14px;font-size:15.5px;color:#33322F;text-align:center;border-right:1px solid #E6E5E0;border-bottom:1px solid #E6E5E0;transition:all .15s}
.gseg li:nth-child(2n){border-right:0}
.gseg li:nth-last-child(-n+2){border-bottom:0}
.gseg li.on{background:var(--ink);color:#fff;font-weight:500}
.mb .gseg li{padding:16px 10px;font-size:15px}
/* segmented */
.seg{display:flex;border:1px solid #CFCEC8;border-radius:4px;overflow:hidden;background:#fff}
.seg li{flex:1;text-align:center;padding:10px 6px;font-size:14px;color:#33322F;border-right:1px solid #E6E5E0;transition:all .15s}
.seg li:last-child{border-right:0}
.seg li.on{background:var(--ink);color:#fff;font-weight:500}
.seg.mini{width:auto}
.seg.mini li{padding:8px 16px;font-size:13.5px}

/* counters */
.cnt{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--hair);font-size:16px}
.cnt .st{display:flex;align-items:center}
.cnt .st b{width:36px;height:36px;border:1px solid #CFCEC8;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:18px;color:#5A5955;cursor:pointer;background:#fff}
.cnt .st i{font:400 22px var(--s);font-style:normal;width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* icon tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.c2{grid-template-columns:1fr 1fr}
.tiles.c2>li>svg,.tiles.c2>li .face>svg{width:88px;height:88px}
.mb .flipset{grid-template-columns:1fr}
.mb .flipset>li{aspect-ratio:auto;min-height:110px;flex-direction:row;justify-content:flex-start;gap:16px;padding:12px 16px}
.mb .flipset>li>svg,.mb .flipset>li .face>svg{width:64px;height:64px}
.mb .flipset>li>span,.mb .flipset>li .face>span{text-align:left;padding:0;font-size:15px}
.mb .flipset>li .face{flex-direction:row;justify-content:flex-start;gap:16px;padding:12px 16px}
.mb .flipset>li.on:after{top:12px;right:12px}
.mb .flipset>li.flip.on{min-height:150px}
.mb .flipset .back{padding:14px 14px 14px}
.mb .flipset .sub{flex-direction:row;gap:8px;margin-top:12px}
.mb .flipset .sub li{flex:1;flex-direction:column;gap:6px;padding:10px 4px;font-size:12px;text-align:center}
.mb .flipset .sub li svg{width:26px;height:26px}
.tiles.c2>li>span,.tiles.c2>li .face>span{font-size:14px}
.tiles>li{min-width:0;background:#fff;border:1px solid var(--hair);border-radius:4px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;transition:all .18s}
.tiles>li>svg,.tiles>li .face>svg{width:60px;height:60px}
.tiles.lg>li>svg,.tiles.lg>li .face>svg{width:76px;height:76px}
.tiles>li>span,.tiles>li .face>span{font-size:12.5px;line-height:1.2;text-align:center;padding:0 8px;color:#33322F}
.tiles>li span small{display:block;font-size:11px;color:var(--grey);margin-top:2px}
.tiles>li.on{border-color:var(--ink);box-shadow:none;transform:none}
.tiles>li.on>span,.tiles>li.on .face>span{color:var(--ink);font-weight:500}
.tiles>li.on:after{content:"";position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:3px;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 8.5l2.5 2.5 4.5-5' fill='none' stroke='white' stroke-width='1.6'/></svg>") center/contain no-repeat}
.tiles.mini{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mb .tiles.mini{grid-template-columns:1fr 1fr}
.mb .tiles.lg>li>svg,.mb .tiles.lg>li .face>svg{width:60px;height:60px}
.tiles.mini>li{aspect-ratio:auto;flex-direction:row;justify-content:flex-start;padding:8px 12px;gap:10px}
.tiles.mini>li svg{width:34px;height:34px}
.tiles.mini>li span{text-align:left;padding:0}
.tiles.mini>li.on:after{display:none}
.nest{margin:10px 0 14px;padding:12px 14px;background:var(--wash);border-radius:4px}
.tiles>li.flip{perspective:800px;background:transparent;border:0;display:block;position:relative}
.tiles>li.flip .face,.tiles>li.flip .back{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--hair);border-radius:4px;background:#fff;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tiles>li.flip .face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tiles>li.flip .back{transform:rotateY(180deg);border-color:var(--ink);padding:10px 10px 8px;display:flex;flex-direction:column}
.tiles>li.flip.on .face{transform:rotateY(-180deg)}
.tiles>li.flip.on .back{transform:rotateY(0)}
.tiles>li.flip.on:after{display:none}
.back b{font-size:13px;font-weight:500;display:flex;justify-content:space-between;color:var(--ink);margin-bottom:14px}
.back b i{font-style:normal;color:var(--grey);font-size:14px;cursor:pointer}
.sub{display:flex;flex-direction:column;gap:4px;flex:1;justify-content:center}
.sub{gap:6px}
.sub li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#33322F;padding:9px 10px;border:1px solid var(--hair);border-radius:3px;background:var(--paper)}
.sub li svg{width:26px;height:26px;flex:none}
.sub li.on{border-color:var(--ink);color:var(--ink);font-weight:500;background:#fff;box-shadow:none;transform:none}
.mb .sub li{font-size:12px;padding:6px 8px;gap:8px}
.mb .back{padding:10px 10px 8px}
.mb .back b{font-size:13px}
.mb .sub li svg{width:22px;height:22px}
.back{padding:12px 12px 10px}
.mb .sub li svg{width:16px;height:16px}
.nest .fl{margin-top:0}

/* fields */
.field{margin-bottom:22px}
.field label{display:block;font-size:13px;color:var(--grey);margin-bottom:6px}
.field .in{font-size:19px;color:var(--ink);padding:6px 0 10px;border-bottom:1px solid #BDBCB6}
.mb .field .in{font-size:18px}
.field .in.ph{color:#B5B4AE}
.field .in.focus{border-bottom:1.5px solid var(--ink)}
.ta{border:1px solid var(--hair);background:#fff;border-radius:4px;min-height:120px;padding:14px 16px;font-size:15.5px;color:#B5B4AE;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:13px;color:#5A5955;border:1px solid var(--hair);border-radius:3px;padding:6px 10px;cursor:pointer}

/* plan actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb .acts{grid-template-columns:1fr}
.drop{background:#fff;border:1px solid var(--hair);border-radius:4px;padding:22px 16px 18px;text-align:center;cursor:pointer;transition:border-color .15s}
.drop.solid{border:1px solid var(--ink);background:var(--paper)}
.drop>svg{width:22px;height:22px;stroke:var(--ink);stroke-width:1.4;fill:none;margin-bottom:10px}
.drop:hover{border-color:var(--ink)}
.drop .big{font:300 19px/1.25 var(--s);font-variation-settings:"opsz" 30;color:var(--ink)}
.drop .big u{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.drop .sm{font-size:12.5px;color:var(--grey);margin-top:8px}
.act{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.act .t{font-size:15.5px;color:var(--ink);font-weight:500}
.act .t small{display:block;font-size:12.5px;color:var(--grey);font-weight:400;margin-top:2px}
.act .go{width:40px;height:40px}
.act .go svg{width:16px;height:16px}
.act .go.pen{background:transparent;border:1px solid var(--ink)}
.act .go.pen svg{stroke:var(--ink)}
.file{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
.file .ic{width:34px;height:42px;border:1px solid #CFCEC8;border-radius:2px;background:#fff;position:relative;flex:none}
.file .ic:after{content:"PDF";position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.06em;color:var(--grey)}
.file small{display:block;color:var(--grey);font-size:12.5px;margin-top:2px}
.file .x{margin-left:auto;color:var(--grey);font-size:18px;line-height:1}
.blk{padding:16px 0 14px;border-top:1px solid var(--hair)}
.blk:last-of-type{border-bottom:1px solid var(--hair)}
.blk h4{font:400 20px/1.1 var(--s);font-variation-settings:"opsz" 30;margin-bottom:12px}
@media (max-width:760px){.dk{flex-direction:column}.dk .art,.dk.dense .art{width:100%;height:220px}.dk .side{padding:22px}}
</style>
</head>

<script>
const arrow='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const root=document.getElementById('root');
document.getElementById('screens').content.querySelectorAll('section').forEach(sec=>{
  const d=sec.dataset, dense=(d.dense?' dense':'')+(d.noart?' noart':'')+(d.opt?' optional':'');
  const go=d.go==='off'?`<span class="go off">${arrow}</span>`:d.go==='skip'?`<span class="go w"><span>Sar peste</span>${arrow}</span>`:`<span class="go">${arrow}</span>`;
  const top=`<div class="top"><span class="wm">Urban Moon</span><span class="ct">${d.ct}</span></div>`;
  const bot=`<div class="bot"><span class="lnk">${d.back||'Înapoi'}</span>${go}</div>`;
  const img=w=>`<div class="art"><img src="https://images.unsplash.com/photo-${d.img}?auto=format&fit=crop&w=${w}&q=78" alt=""></div>`;
  const body=sec.innerHTML;
  root.insertAdjacentHTML('beforeend',`<div class="lbl">${d.n}</div><div class="pair">
    <div class="dk${dense}">${img(1200)}<div class="side">${top}<div class="mid">${body}</div>${bot}</div></div>
    <div class="mb${dense}">${top}${img(800)}<div class="side"><div class="mid">${body}</div>${bot}</div></div>
  </div>`);
});
document.querySelectorAll('ul.single,ul.multi').forEach(ul=>{
  ul.addEventListener('click',e=>{
    const li=e.target.closest('li'); if(!li||li.parentElement!==ul) return;
    if(e.target.closest('.back b i')){li.classList.remove('on');return;}
    if(li.classList.contains('flip')&&li.classList.contains('on')&&e.target.closest('.back')) return;
    if(ul.classList.contains('single')){ul.querySelectorAll('li').forEach(x=>x.classList.remove('on'));li.classList.add('on');}
    else{li.classList.toggle('on');
      const pg=ul.closest('.optional');
      if(pg){const any=ul.querySelectorAll('li.on').length>0;pg.querySelectorAll('.go').forEach(g=>{g.classList.toggle('w',!any);g.querySelector('span').style.display=any?'none':'';});}
      if(ul.classList.contains('max3')){const n=ul.querySelectorAll('li.on').length;ul.querySelectorAll('li').forEach(x=>x.classList.toggle('dim',n>=3&&!x.classList.contains('on')));}}
  });
});
</script>
